  <rect x="215" y="101" width="76" height="20" rx="3" class="pill"/><text x="253" y="115" text-anchor="middle" class="pt">Einfuegen</text>
  <rect x="297" y="101" width="96" height="20" rx="3" class="pill"/><text x="345" y="115" text-anchor="middle" class="pt">Herausnehmen</text>

  <text x="24" y="412" class="s">Getönt: der Teilbaum unter dem gewählten Gelenk (joint2) – genau das,</text>
  <text x="24" y="426" class="s">was „Gelenk und Teilbaum loeschen“ entfernen würde. Gestrichelt: feste Gelenke.</text>
  <text x="24" y="440" class="s">Die Schaltflächen erscheinen, wenn der Zeiger über einem Kasten bzw. einer Kante steht.</text>

  <!-- Reiter -->
  <rect x="444" y="36" width="60" height="20" fill="#ffffff" stroke="#d5dbe3"/><text x="474" y="50" text-anchor="middle">Gelenk</text>
  <rect x="504" y="36" width="60" height="20" fill="#eef1f5" stroke="#d5dbe3"/><text x="534" y="50" text-anchor="middle" class="s">Koerper</text>
  <rect x="444" y="56" width="364" height="412" class="card"/>

  <text x="456" y="80">Gelenk</text><rect x="496" y="68" width="100" height="17" class="ent"/><text x="502" y="80" class="m">joint2</text><text x="590" y="80" class="s" text-anchor="end">▾</text>
  <text x="608" y="80">Typ</text><rect x="630" y="68" width="80" height="17" class="ent"/><text x="636" y="80" class="m">revolute</text><text x="704" y="80" class="s" text-anchor="end">▾</text>

  <text x="456" y="106" class="h">NAME</text><rect x="500" y="94" width="130" height="17" class="ent"/><text x="506" y="106" class="m">joint2</text>
  <rect x="636" y="93" width="76" height="19" rx="2" class="btn"/><text x="674" y="106" text-anchor="middle">Umbenennen</text>

  <text x="456" y="134" class="h">LAENGE [m]</text><text x="556" y="134" class="s">X  0.000    Y  0.000    Z  0.340</text>
  <text x="456" y="156" class="h">WINKEL rpy [deg] ZYX</text><text x="586" y="156" class="s">Roll 0   Pitch 0   Yaw 0</text>
  <text x="456" y="178" class="h">ACHSE</text><text x="556" y="178" class="s">X 0    Y 1    Z 0</text>
  <text x="456" y="200" class="h">AUSLENKUNG</text><text x="556" y="200" class="s">min -120.000   max 120.000   deg</text>
  <text x="456" y="224" class="h">KOPPLUNG</text><text x="530" y="224" class="s">folgt [-- frei --]  Faktor 1.0000  Versatz 0.000</text>
  <rect x="530" y="231" width="98" height="19" rx="2" class="btn"/><text x="579" y="244" text-anchor="middle">Kopplung setzen</text>

  <rect x="456" y="262" width="86" height="21" rx="2" class="btn"/><text x="499" y="276" text-anchor="middle">Uebernehmen</text>
  <rect x="548" y="262" width="118" height="21" rx="2" class="btn"/><text x="607" y="276" text-anchor="middle">Feld zuruecksetzen</text>

  <line x1="456" y1="296" x2="796" y2="296" stroke="#e5e9ef"/>
  <text x="456" y="314" class="h">STRUKTUR</text>
  <rect x="456" y="322" width="108" height="20" rx="2" class="btn"/><text x="510" y="336" text-anchor="middle">Glied anhaengen...</text>
  <rect x="570" y="322" width="102" height="20" rx="2" class="btn"/><text x="621" y="336" text-anchor="middle">Glied einfuegen...</text>
  <rect x="678" y="322" width="120" height="20" rx="2" class="btn"/><text x="738" y="336" text-anchor="middle">Glied herausnehmen...</text>
  <rect x="456" y="348" width="80" height="20" rx="2" class="btn"/><text x="496" y="362" text-anchor="middle">Aussehen...</text>
  <rect x="542" y="348" width="136" height="20" rx="2" class="btn"/><text x="610" y="362" text-anchor="middle">Frames und Werkzeuge...</text>
  <rect x="456" y="374" width="168" height="20" rx="2" class="btn"/><text x="540" y="388" text-anchor="middle">Gelenk und Teilbaum loeschen</text>
  <rect x="630" y="374" width="84" height="20" rx="2" class="btn"/><text x="672" y="388" text-anchor="middle">Rueckgaengig</text>

  <line x1="456" y1="406" x2="796" y2="406" stroke="#e5e9ef"/>
  <rect x="456" y="416" width="70" height="20" rx="2" class="btn"/><text x="491" y="430" text-anchor="middle">Speichern</text>
  <rect x="532" y="416" width="108" height="20" rx="2" class="btn"/><text x="586" y="430" text-anchor="middle">Speichern unter...</text>
