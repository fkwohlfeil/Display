<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'DejaVu Sans', Arial, sans-serif; font-size: 11px; fill: #1f2933; }
    .m { font-family: Consolas, 'DejaVu Sans Mono', monospace; font-size: 10px; }
    .h { font-size: 9px; font-weight: 700; fill: #6b7480; letter-spacing: .5px; }
    .s { font-size: 9.5px; fill: #6b7480; }
    .card { fill: #ffffff; stroke: #d5dbe3; }
    .btn { fill: #e3e8ef; stroke: #d5dbe3; }
    .ent { fill: #ffffff; stroke: #c3cad3; }
    .node { fill: #ffffff; stroke: #9aa3ad; }
    .sel { fill: #d3e3fb; stroke: #2563c9; }
    .edge { stroke: #6b7480; stroke-width: 1; fill: none; }
    .edgesel { stroke: #2563c9; stroke-width: 3; fill: none; }
    .pill { fill: #d3e3fb; stroke: #2563c9; }
    .pt { fill: #2563c9; font-weight: 700; font-size: 9.5px; }
    .num { fill: #d13438; }
    .nt { fill: #ffffff; font-weight: 700; font-size: 11px; }
    text { white-space: pre; }
    .m text { font-family: Consolas, 'DejaVu Sans Mono', monospace; font-size: inherit; }
  </style>

  <rect x="1" y="1" width="818" height="478" rx="8" fill="#eef1f5" stroke="#9aa3ad"/>
  <path d="M1,9 a8,8 0 0 1 8,-8 h802 a8,8 0 0 1 8,8 v18 h-818 z" fill="#dfe4ea"/>
  <text x="14" y="19" style="font-weight:700">URDF bearbeiten</text>

  <!-- Baum -->
  <rect x="12" y="36" width="420" height="432" rx="3" class="card"/>
  <text x="24" y="53" class="h">STRUKTUR</text>
  <text x="90" y="53" class="s">Kasten: anhaengen   |   Kante: einfuegen</text>

  <!-- Kanten -->
  <path class="edge" d="M150,94 L150,128"/>
  <text x="156" y="116" class="s" style="fill:#1f2933">joint1</text>
  <path class="edgesel" d="M150,150 L150,186"/>
  <text x="156" y="172" style="fill:#2563c9;font-weight:700;font-size:9.5px">joint2</text>
  <path class="edge" d="M150,208 L150,244"/>
  <text x="156" y="230" class="s" style="fill:#1f2933">joint3</text>
  <path class="edge" d="M150,266 L150,302"/>
  <text x="156" y="288" class="s" style="fill:#1f2933">joint4</text>
  <path class="edge" d="M150,324 L150,342 L90,342 L90,362" stroke-dasharray="4 3"/>
  <path class="edge" d="M150,342 L210,342 L210,362" stroke-dasharray="4 3"/>
  <text x="96" y="356" class="s" style="fill:#1f2933">tool</text>
  <text x="216" y="356" class="s" style="fill:#1f2933">cam</text>

  <!-- Kaesten -->
  <rect x="95"  y="72"  width="110" height="22" rx="3" class="node"/><text x="150" y="87"  text-anchor="middle">base_link</text>
  <rect x="95"  y="128" width="110" height="22" rx="3" class="node"/><text x="150" y="143" text-anchor="middle">link1</text>
  <rect x="95"  y="186" width="110" height="22" rx="3" class="sel"/><text x="150" y="201" text-anchor="middle">link2</text>
  <rect x="95"  y="244" width="110" height="22" rx="3" class="sel"/><text x="150" y="259" text-anchor="middle">link3</text>
  <rect x="95"  y="302" width="110" height="22" rx="3" class="sel"/><text x="150" y="317" text-anchor="middle">flange</text>
  <rect x="35"  y="362" width="110" height="22" rx="3" class="sel"/><text x="90"  y="377" text-anchor="middle">tcp11</text>
  <rect x="155" y="362" width="110" height="22" rx="3" class="sel"/><text x="210" y="377" text-anchor="middle">camera</text>

  <!-- Schaltflaechen am Kasten link3 -->
  <rect x="215" y="245" width="78" height="20" rx="3" class="pill"/><text x="254" y="259" text-anchor="middle" class="pt">Anhaengen</text>
  <rect x="299" y="245" width="70" height="20" rx="3" class="pill"/><text x="334" y="259" text-anchor="middle" class="pt">Aussehen</text>
