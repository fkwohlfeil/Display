  <rect x="12"  y="152" width="150" height="46" rx="5" class="basis"/>
  <text x="87"  y="171" text-anchor="middle" class="b">kinematik</text>
  <text x="87"  y="188" text-anchor="middle" class="s">Forward Kinematics, Layout</text>
  <rect x="174" y="152" width="150" height="46" rx="5" class="basis"/>
  <text x="249" y="171" text-anchor="middle" class="b">moveit_konfig</text>
  <text x="249" y="188" text-anchor="middle" class="s">Parameter, SRDF, move_group</text>
