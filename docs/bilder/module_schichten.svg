  <rect x="416" y="338" width="190" height="46" rx="5" class="kind"/>
  <text x="511" y="357" text-anchor="middle" class="b">intrinsic_lin_auftrag.py</text>
  <text x="511" y="374" text-anchor="middle" class="s">Achsgrenzen lesen, Hilfsskript</text>
  <rect x="618" y="338" width="190" height="46" rx="5" fill="#f3f4f6" stroke="#9aa3ad" stroke-dasharray="5 3"/>
  <text x="713" y="357" text-anchor="middle" class="b">intrinsic_toppra_wrapper</text>
  <text x="713" y="374" text-anchor="middle" class="s">extern, C++ (Intrinsic Core)</text>

  <text x="12" y="408" class="s">Gestrichelt: nicht in diesem Repository.</text>
