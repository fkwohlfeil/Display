  <text x="411" y="171" text-anchor="middle" class="b">bahn</text>
  <text x="411" y="188" text-anchor="middle" class="s">Zustände, Player, Recorder</text>
  <rect x="498" y="152" width="150" height="46" rx="5" class="basis"/>
  <text x="573" y="171" text-anchor="middle" class="b">totg_prozess</text>
