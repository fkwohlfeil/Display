  <text x="734" y="171" text-anchor="middle" class="b">ros_bruecke</text>
  <text x="734" y="188" text-anchor="middle" class="s">rclpy, TF, Services</text>

  <text x="12" y="218" class="s">Reihenfolge = Importrichtung: ein Modul importiert nur Module links bzw. oberhalb von sich (und die reinen Rechenmodule). Kein Zyklus.</text>

  <text x="12" y="246" class="h">REINE RECHNUNG  · kein Tk, kein ROS, kein NumPy – ohne Bildschirm testbar</text>
