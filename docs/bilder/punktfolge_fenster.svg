<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 452" width="820" height="452">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'DejaVu Sans', Arial, sans-serif; font-size: 11px; fill: #1f2933; }
    .m { font-family: Consolas, 'DejaVu Sans Mono', monospace; font-size: 9.5px; }
    .h { font-size: 9px; font-weight: 700; fill: #6b7480; letter-spacing: .5px; }
    .s { font-size: 9.5px; fill: #6b7480; }
    .card { fill: #ffffff; stroke: #d5dbe3; }
    .btn { fill: #e3e8ef; stroke: #d5dbe3; }
    .ent { fill: #ffffff; stroke: #c3cad3; }
    .off { fill: #eef1f5; stroke: #d5dbe3; }
    .c { fill: #9aa3ad; }
    .ok { fill: #1a7f37; }
    .num { fill: #d13438; }
    .nt { fill: #ffffff; font-weight: 700; font-size: 11px; }
    text { white-space: pre; }
    .m text { font-family: Consolas, 'DejaVu Sans Mono', monospace; font-size: inherit; }
  </style>
  <defs>
    <clipPath id="bericht"><rect x="404" y="66" width="402" height="296"/></clipPath>
    <clipPath id="liste"><rect x="14" y="66" width="376" height="296"/></clipPath>
  </defs>

  <rect x="1" y="1" width="818" height="450" rx="8" fill="#eef1f5" stroke="#9aa3ad"/>
  <path d="M1,9 a8,8 0 0 1 8,-8 h802 a8,8 0 0 1 8,8 v18 h-818 z" fill="#dfe4ea"/>
  <text x="14" y="19" style="font-weight:700">Punktfolge</text>

  <text x="34" y="52" style="font-weight:700;font-size:14px">5 Punkte, geprueft</text>
  <text x="190" y="51" class="s">Lagen werden zuerst ueber /compute_ik aufgeloest, J-Zeilen sind schon Achsziele; hinaus geht die Folge nur mit Achszielen …</text>

  <!-- Punktliste -->
  <rect x="12" y="64" width="380" height="300" rx="3" class="card"/>
  <text x="24" y="81" class="h">PUNKTLISTE</text>
  <g class="m" clip-path="url(#liste)">
    <text x="24" y="102" class="c"># Punktfolge. Je Zeile: X Y Z A B C, danach benannte Felder.</text>
    <text x="24" y="116" class="c"># Ein gesetztes Feld gilt weiter, bis es jemand aendert.</text>
    <text x="24" y="138">J 0 0 0 0 0 0 0   tempo=50 name=Null</text>
    <text x="24" y="154">0.50 0.00 0.80   0 90 0   fahrart=LIN radius=0.05 name=A</text>
    <text x="24" y="170">0.50 0.20 0.80   0 90 0</text>
    <text x="24" y="186">0.50 0.20 0.60   0 90 0</text>
    <text x="24" y="202">0.50 0.00 0.60   0 90 0   radius=0 name=Ende</text>
  </g>

  <!-- Bericht -->
  <rect x="402" y="64" width="406" height="300" rx="3" fill="#fbfcfd" stroke="#d5dbe3"/>
  <text x="414" y="81" class="h">BERICHT</text>
  <g class="m" clip-path="url(#bericht)" style="font-size:9px">
    <text x="412" y="100">Modalzustand am Anfang: PTP, 100 %, 100 %, Radius 0 m  (aus dem Param…</text>
    <text x="412" y="122">  Nr  Name          X        Y        Z      Fahrart     Tempo      Beschl</text>
    <text x="412" y="136">  1  Null          0.000    0.000    1.214      [PTP]        50%     (100%)</text>
    <text x="412" y="150">  2  A             0.500    0.000    0.800        LIN      (50%)     (100%)</text>
    <text x="412" y="164">  3  P3            0.500    0.200    0.800      (LIN)      (50%)     (100%)</text>
    <text x="412" y="178">  4  P4            0.500    0.200    0.600      (LIN)      (50%)     (100%)</text>
    <text x="412" y="192">  5  Ende          0.500    0.000    0.600      (LIN)      (50%)     (100%)</text>
    <text x="412" y="214">Werte in Klammern stammen aus dem Modalzustand, nicht aus der Zeile.</text>
    <text x="412" y="228">Werte in eckigen Klammern legt das Achsziel fest; …</text>
    <text x="412" y="250">A            -> P3           Abstand   0.2000 m, belegt   0.1000, frei</text>
    <text x="412" y="264">P3           -> P4           Abstand   0.2000 m, belegt   0.1000, frei</text>
    <text x="412" y="286" class="ok">5 Punkte, keine Beanstandung.</text>
  </g>

  <!-- Verfahren -->
  <text x="16" y="391">Verfahren</text>
  <rect x="72" y="379" width="70" height="17" class="ent"/><text x="78" y="391" class="m">Intrinsic</text><text x="138" y="391" class="s" text-anchor="end">▾</text>
  <text x="154" y="391" class="s">path_tolerance</text><rect x="228" y="379" width="36" height="17" class="off"/><text x="260" y="391" text-anchor="end" class="m" style="fill:#a8b0ba">0.1</text>
  <text x="272" y="391" class="s">resample_dt</text><rect x="332" y="379" width="36" height="17" class="ent"/><text x="364" y="391" text-anchor="end" class="m">0.01</text>
  <text x="376" y="391" class="s">rundung_rot</text><rect x="436" y="379" width="36" height="17" class="ent"/><text x="468" y="391" text-anchor="end" class="m">0.1</text>
  <text x="480" y="391" class="s">gelenk_abtastung</text><rect x="562" y="379" width="36" height="17" class="ent"/><text x="594" y="391" text-anchor="end" class="m">0.05</text>
  <text x="606" y="391" class="s">ueberschleifen</text><rect x="676" y="379" width="36" height="17" class="ent"/><text x="708" y="391" text-anchor="end" class="m">0.2</text>
  <text x="720" y="391" class="s">v_bahn …</text>

  <!-- Tasten -->
  <rect x="12"  y="412" width="96" height="24" rx="2" class="btn"/><text x="60"  y="428" text-anchor="middle">Pruefen</text>
  <rect x="114" y="412" width="96" height="24" rx="2" class="btn"/><text x="162" y="428" text-anchor="middle">Lage anfuegen</text>
  <rect x="216" y="412" width="96" height="24" rx="2" class="btn"/><text x="264" y="428" text-anchor="middle">Folge planen</text>
  <rect x="318" y="412" width="96" height="24" rx="2" fill="#eef1f5" stroke="#d5dbe3"/><text x="366" y="428" text-anchor="middle" style="fill:#a8b0ba">Folge fahren</text>
  <rect x="420" y="412" width="96" height="24" rx="2" class="btn"/><text x="468" y="428" text-anchor="middle">Bahn als CSV...</text>
  <rect x="712" y="412" width="96" height="24" rx="2" class="btn"/><text x="760" y="428" text-anchor="middle">Schliessen</text>

  <!-- Nummern -->
  <circle cx="18" cy="47" r="10" class="num"/><text x="18" y="51" text-anchor="middle" class="nt">1</text>
  <circle cx="384" cy="72" r="10" class="num"/><text x="384" y="76" text-anchor="middle" class="nt">2</text>
  <circle cx="800" cy="72" r="10" class="num"/><text x="800" y="76" text-anchor="middle" class="nt">3</text>
  <circle cx="800" cy="387" r="10" class="num"/><text x="800" y="391" text-anchor="middle" class="nt">4</text>
  <circle cx="530" cy="424" r="10" class="num"/><text x="530" y="428" text-anchor="middle" class="nt">5</text>
</svg>
