<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'DejaVu Sans', Arial, sans-serif; font-size: 12px; fill: #1f2933; }
    .st { font-size: 13px; font-weight: 700; }
    .l { font-size: 10px; fill: #374151; }
    .k { font-size: 10.5px; fill: #4b5563; }
    .busy { fill: #fdf6ea; stroke: #9a6700; stroke-width: 1.4; }
    .ok { fill: #e6f4ea; stroke: #1a7f37; stroke-width: 1.6; }
    .err { fill: #fdeceb; stroke: #d13438; stroke-width: 1.4; }
    .line { stroke: #4b5563; stroke-width: 1.4; fill: none; }
    .bg { fill: #ffffff; }
    text { white-space: pre; }
    .m text { font-family: Consolas, 'DejaVu Sans Mono', monospace; font-size: inherit; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Kanten zuerst -->
  <path class="line" d="M330,186 L200,66" marker-end="url(#a)"/>
  <path class="line" d="M200,50 L330,50" marker-end="url(#a)"/>
  <path class="line" d="M395,180 L395,70" marker-end="url(#a)"/>
  <path class="line" d="M425,70 L425,180" marker-end="url(#a)"/>
  <path class="line" d="M490,50 L700,50 L700,180" marker-end="url(#a)"/>
  <path class="line" d="M490,193 L620,193" marker-end="url(#a)"/>
  <path class="line" d="M620,209 L490,209" marker-end="url(#a)"/>
  <path class="line" d="M700,220 L700,330" marker-end="url(#a)"/>
  <path class="line" d="M620,342 L470,220" marker-end="url(#a)"/>
  <path class="line" d="M350,220 L170,330" marker-end="url(#a)"/>
  <path class="line" d="M200,350 L330,350" marker-end="url(#a)"/>
  <path class="line" d="M410,330 L410,220" marker-end="url(#a)"/>
  <path class="line" d="M120,70 L120,180" marker-end="url(#a)"/>
  <path class="line" d="M120,330 L120,220" marker-end="url(#a)"/>

  <!-- Beschriftungen der Kanten -->
  <rect x="216" y="117" width="98" height="14" class="bg"/>
  <text x="265" y="128" text-anchor="middle" class="l">Planen, kartesisch</text>
  <text x="265" y="44" text-anchor="middle" class="l">IK gelöst</text>
  <text x="389" y="130" text-anchor="end" class="l">Planen,</text>
  <text x="389" y="143" text-anchor="end" class="l">Achsraum</text>
  <text x="431" y="130" class="l">Plan</text>
  <text x="431" y="143" class="l">gehalten</text>
  <text x="595" y="44" text-anchor="middle" class="l">Halte-Taster noch gedrückt</text>
  <text x="555" y="174" text-anchor="middle" class="l">Fahrt starten /</text>
  <text x="555" y="187" text-anchor="middle" class="l">Folge fahren</text>
  <text x="555" y="224" text-anchor="middle" class="l">Ziel erreicht</text>
  <text x="706" y="268" class="l">Bremsen, STOP,</text>
  <text x="706" y="281" class="l">Taster losgelassen</text>
  <rect x="520" y="274" width="56" height="14" class="bg"/>
  <text x="548" y="285" text-anchor="middle" class="l">angehalten</text>
  <rect x="226" y="268" width="70" height="14" class="bg"/>
  <text x="261" y="279" text-anchor="middle" class="l">Folge planen</text>
  <text x="265" y="343" text-anchor="middle" class="l">alle Punkte gelöst</text>
  <text x="416" y="270" class="l">Bahn da,</text>
  <text x="416" y="283" class="l">„fahrbereit“</text>
  <text x="126" y="128" class="l">keine Lösung</text>
  <text x="126" y="270" class="l">Fehler in IK-Kette,</text>
  <text x="126" y="283" class="l">Planner oder Rechner</text>

  <!-- Zustaende -->
  <rect x="40"  y="30"  width="160" height="40" rx="20" class="busy"/>
  <text x="120" y="55" text-anchor="middle" class="st">IK</text>
  <rect x="330" y="30"  width="160" height="40" rx="20" class="busy"/>
  <text x="410" y="55" text-anchor="middle" class="st">PLANEN</text>
  <rect x="40"  y="180" width="160" height="40" rx="20" class="err"/>
  <text x="120" y="205" text-anchor="middle" class="st">FEHLER</text>
  <rect x="330" y="180" width="160" height="40" rx="20" class="ok"/>
  <text x="410" y="205" text-anchor="middle" class="st">BEREIT</text>
  <rect x="620" y="180" width="160" height="40" rx="20" class="busy"/>
  <text x="700" y="205" text-anchor="middle" class="st">FAHREN</text>
  <rect x="40"  y="330" width="160" height="40" rx="20" class="busy"/>
  <text x="120" y="355" text-anchor="middle" class="st">FOLGE IK</text>
  <rect x="330" y="330" width="160" height="40" rx="20" class="busy"/>
  <text x="410" y="355" text-anchor="middle" class="st">FOLGE</text>
  <rect x="620" y="330" width="160" height="40" rx="20" class="busy"/>
  <text x="700" y="355" text-anchor="middle" class="st">BREMSEN</text>

  <!-- Legende -->
  <rect x="40" y="398" width="14" height="10" rx="3" class="busy"/>
  <text x="62" y="407" class="k">gesperrt (STATES_BUSY): Modell, Parameter und Sollwerte lassen sich nicht ändern</text>
  <rect x="40" y="418" width="14" height="10" rx="3" class="ok"/>
  <text x="62" y="427" class="k">frei · gehaltener Plan bzw. fahrbereite Folge bleibt erhalten</text>
  <rect x="40" y="438" width="14" height="10" rx="3" class="err"/>
  <text x="62" y="447" class="k">frei · aus FEHLER heraus kann sofort ein neuer Auftrag gestellt werden</text>
  <text x="40" y="465" class="k">Bremsen oder STOP während IK, PLANEN, FOLGE IK oder FOLGE verwirft den Auftrag und führt direkt nach BEREIT.</text>
</svg>
